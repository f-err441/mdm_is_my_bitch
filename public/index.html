<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENTEST SYNDICATE // OVERRIDE HUB</title>
    <style>
        :root {
            --bg-color: #060202;
            --panel-bg: #0f0505;
            --accent-red: #ff1e3c;
            --accent-dim: #7a1220;
            --accent-yellow: #ffe600;
            --text-glow: rgba(255, 30, 60, 0.4);
            --font-stack: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--accent-red);
            font-family: var(--font-stack);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-shadow: 0 0 6px var(--text-glow);
            box-sizing: border-box;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 3;
        }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .panel {
            border: 1px solid var(--accent-red);
            box-shadow: 0 0 20px rgba(255, 30, 60, 0.15);
            padding: 25px;
            background-color: var(--panel-bg);
            box-sizing: border-box;
        }

        .collective-banner {
            font-size: 0.75rem;
            color: var(--accent-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 15px;
            grid-column: 1 / -1;
        }

        .pixel-art-box {
            border: 1px solid var(--accent-dim);
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
        }

        .pixel-finger {
            width: 110px;
            height: 120px;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 2px;
            margin-bottom: 15px;
        }

        .pixel { background-color: transparent; }
        .pixel.on {
            background-color: var(--accent-yellow);
            box-shadow: 0 0 8px rgba(255, 230, 0, 0.7);
        }

        .pixel-label {
            font-size: 0.75rem;
            color: var(--accent-yellow);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 230, 0, 0.4);
        }

        .telemetry-header {
            font-size: 0.8rem;
            color: var(--accent-dim);
            border-bottom: 1px dashed var(--accent-dim);
            padding-bottom: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .status-line {
            font-size: 0.75rem;
            color: var(--accent-dim);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .form-group { margin: 15px 0; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: var(--accent-red);
        }

        input[type="file"] {
            background: #030101;
            border: 1px solid var(--accent-dim);
            color: var(--accent-red);
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            font-family: var(--font-stack);
            cursor: pointer;
            font-size: 0.8rem;
        }

        button {
            background-color: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 12px 20px;
            font-family: var(--font-stack);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-red);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent-red);
        }

        #output {
            margin-top: 20px;
            border-top: 1px dashed var(--accent-dim);
            padding-top: 12px;
            font-size: 0.75rem;
            word-break: break-all;
        }

        .success-text { color: #ff4d6d; }
        .error-text { color: #ff3333; }

        a.install-btn {
            display: block;
            text-decoration: none;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        <div class="collective-banner">// PENTEST SYNDICATE // DISTRO_NODE_09 //</div>

        <div class="panel">
            <div class="pixel-art-box">
                <div class="pixel-finger" id="pixelFinger"></div>
                <div class="pixel-label">[ OVERRIDE ACTIVE ]</div>
            </div>
        </div>

        <div class="panel">
            <div class="telemetry-header">SYS_TELEMETRY: SECURE_MESH</div>
            <h1>OTA Payload Gateway</h1>
            <div class="status-line">TARGET: MDM_BYPASS_AUDIT // STATUS: READY</div>

            <form id="payloadForm">
                <div class="form-group">
                    <label for="ipaFile">> SELECT PAYLOAD</label>
                    <input type="file" id="ipaFile" accept=".ipa" required>
                </div>
                <button type="submit" id="deployBtn">[ DEPLOY ]</button>
            </form>

            <div id="output">
                <span class="status-line">> AWAITING .IPA PAYLOAD...</span>
            </div>
        </div>
    </div>

    <script>
        const fingerGrid = document.getElementById('pixelFinger');
        const pixelMap = [
            "00001110000",
            "00010001000",
            "00010001000",
            "00010001000",
            "00010001000",
            "11111111111",
            "10111111101",
            "10111111101",
            "10111111101",
            "00011111000",
            "00001110000",
            "00001110000"
        ];

        pixelMap.forEach(row => {
            for (let char of row) {
                const p = document.createElement('div');
                p.className = 'pixel' + (char === '1' ? ' on' : '');
                fingerGrid.appendChild(p);
            }
        });

        document.getElementById('payloadForm').onsubmit = async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('ipaFile');
            const outputDiv = document.getElementById('output');
            const file = fileInput.files[0];

            if (!file) return;

            outputDiv.innerHTML = '<span class="status-line">> REQUESTING CLOUDFLARE UPLOAD TICKET...</span>';

            try {
                // Step 1: Send ONLY the filename string as JSON to prevent 413 payload limits
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: file.name })
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to generate ticket');

                outputDiv.innerHTML = '<span class="status-line">> STREAMING .IPA DIRECTLY TO CLOUDFLARE R2...</span>';

                // Step 2: Upload the heavy .ipa binary directly to Cloudflare via the presigned URL
                const uploadRes = await fetch(data.uploadUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: file
                });

                if (!uploadRes.ok) throw new Error('Direct upload to Cloudflare storage failed.');

                // Step 3: Build the OTA install manifest link
                const host = window.location.host;
                const protocol = window.location.protocol;
                const manifestUrl = `${protocol}//${host}/api/manifest?url=${encodeURIComponent(data.publicFileUrl)}&name=${encodeURIComponent(file.name)}`;
                const installUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(manifestUrl)}`;

                outputDiv.innerHTML = `
                    <p class="success-text">> PAYLOAD DEPLOYED SUCCESSFULLY.</p>
                    <a href="${installUrl}" class="install-btn">
                        <button type="button">[ INITIALIZE TARGET INSTALL ]</button>
                    </a>
                `;
            } catch (err) {
                outputDiv.innerHTML = `<p class="error-text">> SYSTEM_FAULT: ${err.message}</p>`;
            }
        };
    </script>
</body>
</html>
